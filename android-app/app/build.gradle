plugins { id 'com.android.application' }

android {
    namespace 'com.gallery.kiosk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gallery.kiosk.v166'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.6.6'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

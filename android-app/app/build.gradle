plugins { id 'com.android.application' }

android {
    namespace 'com.gallery.kiosk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gallery.kiosk.mediafull'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '1.7.5-mediafull'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

plugins { id 'com.android.application' }

android {
    namespace 'com.gallery.kiosk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gallery.kiosk.mixedmedia'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.7.4-mixed'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

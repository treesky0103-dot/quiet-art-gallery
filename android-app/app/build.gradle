plugins { id 'com.android.application' }

android {
    namespace 'com.gallery.kiosk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gallery.kiosk.worldart'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '1.8.0-worldart'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

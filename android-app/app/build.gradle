plugins { id 'com.android.application' }

android {
    namespace 'com.gallery.kiosk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gallery.kiosk.sources85'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '1.8.2-sources85'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

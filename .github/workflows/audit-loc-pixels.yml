name: Validate LOC curated artwork JPEG pixels
on:
  push:
    branches: [feat-v187-verified-new-global-sources-20261115]
    paths: ['tools/audit_loc_art_pixels.py','.github/workflows/audit-loc-pixels.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/audit_loc_art_pixels.py

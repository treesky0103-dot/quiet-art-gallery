name: Verify Princeton JPEG pixels and Québec open-data record rights
on:
  push:
    branches: [feat-v187-verified-new-global-sources-20261115]
    paths: ['tools/v187_pixel_and_rights.py','.github/workflows/verify-v187-images.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/v187_pixel_and_rights.py

name: Real 80-20 painting collection multi-batch (NOT 259200 ready)
on:
  push:
    branches:
      - collect-80pct-scale-batch-20261114
    paths:
      - scripts/collect_80pct_paged_batch.py
      - .github/workflows/collect-80pct-batches.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    name: "Actual artwork files batch ${{ matrix.batch }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - batch: '101'
            cma: '700'
            aic: '7'
            met: '700'
          - batch: '102'
            cma: '1200'
            aic: '8'
            met: '800'
          - batch: '103'
            cma: '1700'
            aic: '9'
            met: '900'
          - batch: '104'
            cma: '2200'
            aic: '10'
            met: '1000'
    env:
      QAG_BATCH_ID: "${{ matrix.batch }}"
      QAG_CMA_SKIP: "${{ matrix.cma }}"
      QAG_AIC_PAGE: "${{ matrix.aic }}"
      QAG_MET_SKIP: "${{ matrix.met }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Source syntax check
        run: python -m py_compile scripts/collect_80pct_paged_batch.py
      - name: Download, decode, check artwork creation year and JPEG hashes
        run: python -u scripts/collect_80pct_paged_batch.py
      - name: Independent inventory check
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, os
          from pathlib import Path
          from PIL import Image
          bid=os.environ["QAG_BATCH_ID"]
          root=Path(f'audit-80pct-batch-{bid}')
          r=json.loads((root/'audit_report.json').read_text())
          with (root/'verified_downloaded_decoded.csv').open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert r['target']=={"all":259200,"modern_1800_to_2026":207360,"earlier_before_1800":51840,"modern_percent":80}
          assert r['actual_90day_ready'] is False
          assert len(rows)==r['actual_downloaded_decoded']['all']
          assert sum(x['era']=='1800-2026' for x in rows)==r['actual_downloaded_decoded']['modern']
          assert sum(x['era']=='pre-1800' for x in rows)==r['actual_downloaded_decoded']['earlier']
          assert len(rows)==len({(x['source'],x['id']) for x in rows})
          assert len(rows)==len({x['sha256'] for x in rows})
          files=list((root/'samples').glob('*'))
          assert len(files)==len(rows)
          for row in rows:
              raw=Path(row['file']).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
              with Image.open(io.BytesIO(raw)) as im:
                  im.load()
                  w,h=im.size
                  assert im.format=='JPEG'
                  assert w>=1000 and h>=1400 and w<h
                  assert min((w/h)/.625,.625/(w/h))>=.75
                  assert w==int(row['width']) and h==int(row['height'])
          print(f'ACTUAL BYTE-VERIFIED BATCH={bid} IMAGES={len(rows)} 1800plus={r["actual_downloaded_decoded"]["modern"]} older={r["actual_downloaded_decoded"]["earlier"]}')
          PY
      - name: Save image bytes plus original/year/license/sha metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-real-paintings-batch-${{ matrix.batch }}
          path: audit-80pct-batch-${{ matrix.batch }}/
          if-no-files-found: warn
          retention-days: 14

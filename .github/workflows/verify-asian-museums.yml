name: Verify Asian Museum Sources
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check Wikimedia Commons collection query from GitHub
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json
          museums={
            'korea':'Paintings in the National Museum of Korea',
            'tokyo':'Paintings in the Tokyo National Museum',
            'kyoto':'Paintings in the Kyoto National Museum',
            'nara':'Paintings in the Nara National Museum',
            'taipei':'Paintings in the National Palace Museum'
          }
          for name,cat in museums.items():
            params={'action':'query','generator':'search','gsrsearch':f'deepcategory:"{cat}"','gsrnamespace':6,'gsrlimit':5,'prop':'imageinfo','iiprop':'url|size|mime|extmetadata','iiurlwidth':843,'format':'json','formatversion':2}
            url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'QuietArtGallery/1.3 (https://github.com/treesky0103-dot/quiet-art-gallery; public museum image check)','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as response: data=json.load(response)
              pages=data.get('query',{}).get('pages',[])
              print(name,'RESULT_PAGES',len(pages),'ERROR',data.get('error'))
              for p in pages[:1]:
                inf=(p.get('imageinfo') or [{}])[0]
                print('EXAMPLE',p.get('title'),inf.get('mime'),(inf.get('extmetadata') or {}).get('LicenseShortName',{}).get('value'),bool(inf.get('thumburl')))
            except Exception as e: print(name,'ERROR',type(e).__name__,str(e)[:180])
          PY

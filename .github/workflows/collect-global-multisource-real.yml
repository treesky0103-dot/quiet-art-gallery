name: Acquire actual artworks from global non-museum public archives
on:
  push:
    branches:
      - feat-multisource-world-openart-20261114
    paths:
      - scripts/collect_global_open_art_multisource.py
      - .github/workflows/collect-global-multisource-real.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local image decoder (no paid key or card)
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Check source
        run: python -m py_compile scripts/collect_global_open_art_multisource.py
      - name: Query public art archives and download decoded real files
        run: python -u scripts/collect_global_open_art_multisource.py
      - name: Independently audit every saved JPG against its SHA and screen-fill rules
        run: |
          python - <<'PY'
          import csv,hashlib,io,json
          from pathlib import Path
          from PIL import Image
          root=Path('audit-global-multisource-20261114')
          report=json.loads((root/'report.json').read_text())
          with (root/'verified_real_images.csv').open(encoding='utf-8',newline='') as f:
              items=list(csv.DictReader(f))
          assert report['actual_complete_259200'] is False
          assert report['saved_actual_images']==len(items)
          assert len(items)==len({x['sha256'] for x in items})
          assert len(items)==len(list((root/'artworks').glob('*.jpg')))
          for a in items:
              data=Path(a['file']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==a['sha256']
              with Image.open(io.BytesIO(data)) as im:
                  im.load()
                  assert im.format=='JPEG'
                  assert im.width>=1000 and im.height>=1400 and im.width<im.height
                  assert min((im.width/im.height)/.625,.625/(im.width/im.height))>=.75
          print('GLOBAL_MULTISOURCE_INDEPENDENT_BYTES_VERIFIED',len(items))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-multisource-global-open-art-JPG-and-evidence
          path: audit-global-multisource-20261114/
          if-no-files-found: warn
          retention-days: 2

name: US National Gallery second full CSV join and real portrait JPEG batch
on:
  push:
    branches:
      - collect-80pct-scale-batch-20261114
    paths:
      - scripts/probe_nga_expanded_real_images.py
      - .github/workflows/probe-nga-expanded-real.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Independently join official National Gallery of Art image dimension and artwork year CSV
        run: |
          python -m py_compile scripts/probe_nga_expanded_real_images.py
          python -u scripts/probe_nga_expanded_real_images.py
      - name: Independently verify every decoded JPEG and author/source date evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,hashlib
          j=json.loads(Path('audit-nga-real-expanded/audit.json').read_text())
          assert j['actual_259200_ready'] is False
          assert j['verified_image_files_this_run']==len(j['nga_verified_images'])
          for row in j['nga_verified_images']:
              f=Path(row['image_path'])
              data=f.read_bytes()
              assert hashlib.sha256(data).hexdigest()==row['saved_sha256']
              with Image.open(f) as image:
                  image.load()
                  assert image.width>=1000 and image.height>=1400
                  assert image.width<image.height
                  assert min((image.width/image.height)/.625,.625/(image.width/image.height))>=.75
          print('NGA actual new file proof:',len(j['nga_verified_images']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-gallery-of-art-second-cc0-portrait-image-files
          path: audit-nga-real-expanded/
          if-no-files-found: warn
          retention-days: 3

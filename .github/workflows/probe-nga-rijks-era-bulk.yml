name: Audit National Gallery of Art bulk CSV and Rijksmuseum year supply
on:
  push:
    branches:
      - collect-80pct-scale-batch-20261114
    paths:
      - scripts/probe_nga_rijks_era_bulk.py
      - .github/workflows/probe-nga-rijks-era-bulk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Compile research script
        run: python -m py_compile scripts/probe_nga_rijks_era_bulk.py
      - name: Independently census NGA image CSV and Rijks century query
        run: python -u scripts/probe_nga_rijks_era_bulk.py
      - name: Validate report and every saved NGA image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,hashlib
          p=Path('audit-nga-rijks-era/audit.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['target_total']==259200 and r['target_1800plus']==207360
          assert r['actual_259200_ready'] is False
          paths=list(Path('audit-nga-rijks-era/samples').glob('*.jpg'))
          assert len(paths)==r['verified_image_files_this_run']
          for row in r.get('nga_verified_images',[]):
              data=Path(row['image_path']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==row['saved_sha256']
              with Image.open(Path(row['image_path'])) as im:
                  im.load()
                  assert im.width >= 1000 and im.height >= 1400
                  assert im.width<im.height
          print('Actual NGA file decode/hashes: verified',len(paths))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nga-rijks-1800-era-census-and-byte-proof
          path: audit-nga-rijks-era/
          if-no-files-found: warn
          retention-days: 14

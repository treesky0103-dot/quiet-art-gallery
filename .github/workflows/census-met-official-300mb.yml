name: Metropolitan Museum complete 300 MB official CC0 flat artwork year census
on:
  push:
    branches:
      - collect-80pct-scale-batch-20261114
    paths:
      - scripts/census_met_openaccess_csv.py
      - .github/workflows/census-met-official-300mb.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source syntax
        run: python -m py_compile scripts/census_met_openaccess_csv.py
      - name: Fetch and census actual official Met LFS CSV artwork creation years and 2D
        run: python -u scripts/census_met_openaccess_csv.py
      - name: Reject source metadata inflation
        run: |
          python - <<'PY'
          import gzip,csv,json
          from pathlib import Path
          r=Path('audit-met-official-dump')
          x=json.loads((r/'report.json').read_text())
          with gzip.open(r/'Met_2d_dated_cc0_CANDIDATES_not_downloaded.csv.gz','rt',encoding='utf-8') as f:
             v=list(csv.DictReader(f))
          assert x['actual_JPEG_file_downloads']==0
          assert not x['verified_259200']
          assert x['unique_year_2d_cc0_metadata_candidates']==len(v)
          assert len({t['object_id'] for t in v})==len(v)
          print('Verified CC0 metadata candidates only:',len(v))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metropolitan-museum-2d-cc0-modern-and-older-metadata-census
          path: |
            audit-met-official-dump/report.json
            audit-met-official-dump/Met_2d_dated_cc0_CANDIDATES_not_downloaded.csv.gz
          if-no-files-found: warn
          retention-days: 7

name: Audit 1800+ 80-percent artworks worldwide
on:
  push:
    branches:
      - feat-1800plus-80pct-global-archives-20261114
    paths:
      - scripts/collect_1800plus_80pct_pilot.py
      - .github/workflows/audit-modern-80percent.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Check source syntax
        run: python -m py_compile scripts/collect_1800plus_80pct_pilot.py
      - name: Test museum APIs and actual image bytes for 80-percent era split
        run: python -u scripts/collect_1800plus_80pct_pilot.py
      - name: Check output manifest and 90 day target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('audit-1800plus-80pct/audit_report.json').read_text())
          assert x['target']['all']==259200
          assert x['target']['modern_1800_to_2026']==207360
          assert x['target']['earlier_before_1800']==51840
          assert x['target']['modern_percent']==80
          assert x['actual_90day_ready'] is False
          assert x['actual_downloaded_decoded']['all']==len(list(Path('audit-1800plus-80pct/samples').glob('*')))
          assert sum(x['actual_downloaded_decoded'][k] for k in ('modern','earlier'))==x['actual_downloaded_decoded']['all']
          print('Era target / downloaded byte count verified. 259200 NOT acquired.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-1800plus-80pct-paintings-sample
          path: audit-1800plus-80pct/
          if-no-files-found: warn
          retention-days: 14

name: Cross-verify global artist original JPEGs against dated 675 image ledger
on:
  push:
    branches:
      - feat-multisource-world-openart-20261114
    paths:
      - scripts/crosscheck_global_openart_against_existing.py
      - .github/workflows/crosscheck-global-openart.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow and image bitwise re-verification
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download earlier actual JPEG proof (not metadata only)
        uses: actions/download-artifact@v4
        with:
          run-id: 43569337831
          name: actual-multisource-global-open-art-JPG-and-evidence
          path: research-input/global-new
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Re-read every actual image and compare 675 prior SHA hashes
        run: |
          python -m py_compile scripts/crosscheck_global_openart_against_existing.py
          python -u scripts/crosscheck_global_openart_against_existing.py
      - name: Check evidence classifications are not false 1800+ claims
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          base=Path('data/verified_80pct')
          r=json.loads((base/'additional_global_art_audit.json').read_text())
          with (base/'additional_global_art_unknown_year.csv').open(newline='',encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==r['additional_byte_verified']
          assert len(rows)==len({x['sha256'] for x in rows})
          assert not r['completed']
          assert not r['artwork_year_80percent_verified']
          assert not r['files_persist_in_repo']
          assert all(x['era']=='unknown' for x in rows)
          print('UNIQUE OPEN ART FILE HASHES AND UNKNOWN YEARS VERIFIED',len(rows))
          PY
      - name: Commit durable hashes and source provenance only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified_80pct/additional_global_art_unknown_year.csv data/verified_80pct/additional_global_art_audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Record verified non-museum open-art image SHA hashes; creation year remains unknown"
          git push origin HEAD:feat-multisource-world-openart-20261114

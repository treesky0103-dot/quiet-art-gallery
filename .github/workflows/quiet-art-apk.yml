name: Build Quiet Art Folder APK
on:
  push:
    branches:
      - build/quiet-art-local-folder-apk-20261118
  pull_request:
    paths:
      - 'android-art-folder/**'
      - '.github/workflows/quiet-art-apk.yml'
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK and licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        working-directory: android-art-folder
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK archive and signature
        run: |
          APK=android-art-folder/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: QuietArtGallery_ArtFolder_APK
          path: android-art-folder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

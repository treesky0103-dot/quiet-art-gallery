name: Build Quiet Art Folder APK
on:
  push:
    branches:
      - build/quiet-art-v2-1-ai-crop-20261118
  pull_request:
    paths:
      - 'android-art-folder/**'
      - '.github/workflows/quiet-art-apk.yml'
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Fetch public Real-ESRGAN model for offline APK
        run: |
          mkdir -p android-art-folder/app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/john-rocky/LiteRT-Models/releases/download/v1/real_esrgan_x4v3.tflite \
            --output android-art-folder/app/src/main/assets/real_esrgan_x4v3.tflite
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('android-art-folder/app/src/main/assets/real_esrgan_x4v3.tflite')
          assert p.stat().st_size==4878664, f'Model size changed: {p.stat().st_size}'
          data=p.read_bytes()
          assert data[4:8]==b'TFL3', 'Not a TensorFlow Lite model'
          assert hashlib.sha256(data).hexdigest()=='8a284b295049651c67ffdf35d4f365c1d702c13286836de2a33de76d5324146d', 'Model hash mismatch'
          print('MODEL_SHA256='+hashlib.sha256(data).hexdigest())
          PY
      - name: Test offline focal crop geometry
        run: |
          mkdir -p /tmp/quietart-focus-test
          javac -d /tmp/quietart-focus-test \
            android-art-folder/app/src/main/java/com/quietart/gallery/FocusProjection.java \
            android-art-folder/tests/FocusProjectionTest.java
          java -cp /tmp/quietart-focus-test FocusProjectionTest
      - name: Test portrait image sizing geometry
        run: |
          mkdir -p /tmp/quietart-scaling-test
          javac -d /tmp/quietart-scaling-test             android-art-folder/app/src/main/java/com/quietart/gallery/ImageScaleRules.java             android-art-folder/tests/PortraitSizingTest.java
          java -cp /tmp/quietart-scaling-test PortraitSizingTest
      - name: Compile debug APK
        working-directory: android-art-folder
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK archive and signature
        run: |
          APK=android-art-folder/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: QuietArtGallery_ArtFolder_APK
          path: android-art-folder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: On-device TensorFlow Lite and image crop smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          working-directory: android-art-folder
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace

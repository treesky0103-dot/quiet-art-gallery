name: Verify NMAAHC CC0 poster images and NMAH/AAA bounded samples
on:
  push:
    branches: [feat-v188-smithsonian-2d-openaccess-20261115]
    paths: ['tools/verify_v188_extra_smithsonian_images.py','.github/workflows/verify-v188-extra-images.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/verify_v188_extra_smithsonian_images.py

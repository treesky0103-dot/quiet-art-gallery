name: Cleveland full 43k dated public-domain art metadata census
on:
  push:
    branches:
      - collect-80pct-scale-batch-20261114
    paths:
      - scripts/census_cma_43k_metadata.py
      - .github/workflows/census-cma-43k.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query complete CMA free CC0 painting/drawing/print metadata
        run: |
          python -m py_compile scripts/census_cma_43k_metadata.py
          python -u scripts/census_cma_43k_metadata.py
      - name: Verify no metadata counted as files
        run: |
          python - <<'PY'
          import gzip,csv,json
          from pathlib import Path
          p=Path('audit-cma-full-metadata')
          j=json.loads((p/'report.json').read_text())
          with gzip.open(p/'CMA_75pct_CC0_era_candidates_NOT_ACQUIRED.csv.gz','rt',encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert j['unique_candidate_metadata_not_downloaded']==len(rows)
          assert j['actual_image_bytes_downloaded']==0
          assert j['complete_259200'] is False
          print('Cleveland metadata record audit',len(rows),'source records, ZERO actual file bytes this run')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cma-43k-open-portrait-flat-art-metadata
          path: audit-cma-full-metadata/
          if-no-files-found: warn
          retention-days: 7

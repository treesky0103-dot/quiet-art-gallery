name: Publish v1.6 APK download
on:
  push:
    paths:
      - '.github/workflows/publish-v1.6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tagged release source
        uses: actions/checkout@v4
      - name: Validate version and JS
        run: |
          grep -q "versionName '1.6.0'" android-app/app/build.gradle
          node --check web/app.js
          node --check web/core.js
          node --test tests/*.test.cjs
          for f in app.js core.js index.html style.css sw.js manifest.webmanifest icon-192.png icon-512.png; do
            cmp "web/$f" "android-app/app/src/main/assets/$f"
          done
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Package and verify APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk QuietArtGallery_v1.6.apk
          test -s QuietArtGallery_v1.6.apk
          sha256sum QuietArtGallery_v1.6.apk | tee SHA256SUMS.txt
          python3 - <<'PY'
          from zipfile import ZipFile
          path='QuietArtGallery_v1.6.apk'
          with ZipFile(path) as z:
            assert z.testzip() is None
            assert 'classes.dex' in z.namelist()
            assert 'assets/app.js' in z.namelist()
            assert 'assets/core.js' in z.namelist()
          print('APK ZIP integrity and app assets OK')
          PY
      - name: Publish public download on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.6 >/dev/null 2>&1; then
            gh release upload v1.6 QuietArtGallery_v1.6.apk SHA256SUMS.txt --clobber
          else
            gh release create v1.6 QuietArtGallery_v1.6.apk SHA256SUMS.txt \
              --title 'Quiet Art Gallery v1.6 — Android APK' \
              --notes 'Android tablet APK with 19 collection feeds. Free public-domain/CC0 art sources; 30-second rotation. Save v1.0 before switching. Debug-signed build (new installations only).'
          fi
      - name: Verify public release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.6 --json url,assets --jq '.url, (.assets[] | .name)'

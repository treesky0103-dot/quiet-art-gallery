name: Rijksmuseum second 60 CC0 dated portrait image batch
on:
  push:
    branches:
      - collect-80pct-scale-batch-20261114
    paths:
      - scripts/probe_rijks_expanded_actual_60.py
      - .github/workflows/probe-rijks-expanded-real.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Independently query and download unique Rijksmuseum IIIF drawings and prints
        run: |
          python -m py_compile scripts/probe_rijks_expanded_actual_60.py
          python -u scripts/probe_rijks_expanded_actual_60.py
      - name: Verify actual output JPEG bytes and no fake 259200 result
        run: |
          python - <<'PY'
          import json,hashlib,io
          from pathlib import Path
          from PIL import Image
          r=json.loads(Path('audit-rijks-expanded-actual/report.json').read_text())
          assert r['all_259200_verified'] is False
          assert r['actual_downloaded_count']==len(r['actual_downloaded'])
          assert r['year_qualified_modern']+r['year_qualified_old']==len(r['actual_downloaded'])
          for x in r['actual_downloaded']:
            data=Path(x['saved_file']).read_bytes()
            assert hashlib.sha256(data).hexdigest()==x['sha256']
            im=Image.open(io.BytesIO(data));im.load()
            assert im.width>=1000 and im.height>=1400 and im.width<im.height
            assert min((im.width/im.height)/.625,.625/(im.width/im.height))>=.75
          print('Rijks expanded actual images:',r['actual_downloaded_count'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rijks-80percent-expanded-2d-verified-file-batch
          path: audit-rijks-expanded-actual/
          if-no-files-found: warn
          retention-days: 3

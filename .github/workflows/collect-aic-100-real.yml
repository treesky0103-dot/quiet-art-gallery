name: Chicago 100 actual 80-percent modern art public IIIF JPEG files
on:
  push:
    branches:
      - collect-80pct-scale-batch-20261114
    paths:
      - scripts/collect_aic_100_real_images.py
      - .github/workflows/collect-aic-100-real.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Retrieve institution-wide metadata census (only candidates)
        uses: actions/download-artifact@v4
        with:
          run-id: 43560933049
          name: chicago-all-130k-artworks-date-portrait-metadata-census
          path: research-input/aic
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Real IIIF artwork files download and independent source-year checks
        run: |
          python -m py_compile scripts/collect_aic_100_real_images.py
          python -u scripts/collect_aic_100_real_images.py
      - name: Verify every actually saved uncropped JPEG and source rights
        run: |
          python - <<'PY'
          import hashlib,json,io
          from pathlib import Path
          from PIL import Image
          r=json.loads(Path('audit-aic-real-100/report.json').read_text())
          assert r['target_complete'] is False
          assert r['verified_files']==len(r['actual_downloaded'])
          assert r['verified_modern']+r['verified_older']==r['verified_files']
          assert len({x['id'] for x in r['actual_downloaded']})==r['verified_files']
          assert len({x['sha256'] for x in r['actual_downloaded']})==r['verified_files']
          for x in r['actual_downloaded']:
              data=Path(x['saved_file']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==x['sha256']
              im=Image.open(io.BytesIO(data));im.load()
              assert im.width>=1000 and im.height>=1400 and im.width<im.height
              assert min((im.width/im.height)/.625,.625/(im.width/im.height))>=.75
          print('Chicago actual JPEG source + byte verified:',r['verified_files'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chicago-100-real-cc0-80pct-painting-iiif-jpeg
          path: audit-aic-real-100/
          if-no-files-found: warn
          retention-days: 3

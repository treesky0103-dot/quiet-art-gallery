name: Rapid verify real paintings first page
on:
  push:
    branches:
      - collect-paintings-259200-pilot-20261114
    paths:
      - .github/workflows/rapid-paintings-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch first-page pilot and test file decoding
        env:
          MAX_IMAGES: "12"
          MAX_PAGES: "2"
        run: python -u scripts/download_verified_paintings_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-paintings-smoke-files
          path: downloaded-paintings-audit/
          if-no-files-found: warn
          retention-days: 7

name: Build Gallery APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Apply v1.2 patch from verified archive and sync assets
        run: |
          python3 - <<'PY'
          import base64, pathlib, shutil, subprocess, zlib
          root = pathlib.Path.cwd()
          gradle = (root / "android-app/app/build.gradle").read_text()
          if "versionName '1.2.0'" not in gradle:
              encoded = (root / "tools/v1.2-source.patch.zlib.b64").read_text().strip()
              source_patch = zlib.decompress(base64.b64decode(encoded)).decode()
              subprocess.run(["patch", "-p0", "--batch", "--forward"], input=source_patch, text=True, check=True)
          for filename in ("app.js", "core.js", "index.html", "style.css", "sw.js"):
              shutil.copy2(root / "web" / filename, root / "android-app/app/src/main/assets" / filename)
          PY
      - name: Verify new version and 13-movement tests and assets
        run: |
          grep -q "versionName '1.2.0'" android-app/app/build.gradle
          node --check web/app.js
          node --check web/core.js
          node --test tests/core.test.cjs
          for f in app.js core.js index.html style.css sw.js manifest.webmanifest icon-192.png icon-512.png; do
            cmp "web/$f" "android-app/app/src/main/assets/$f"
          done
      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform 35 and tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Build Android debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Confirm APK exists and compute SHA-256
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Commit tested v1.2 sources to main branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/ android-app/ tests/
            git commit -m "Implement v1.2 movement rotation, captions and 180 degree display"
            git push origin HEAD:main
          fi
      - name: Archive installable v1.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: QuietArtGallery-v1.2-debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: Probe emergency offline high-resolution painting assets
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_emergency_deck.py'
      - '.github/workflows/probe-emergency-deck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify and download 4 real CC0 paintings for offline 30-second emergency rotation
        run: python3 scripts/build_emergency_deck.py
      - name: Save verified assets for development testing
        uses: actions/upload-artifact@v4
        with:
          name: QuietGallery-emergency-deck-verified
          path: |
            android-app/app/src/main/assets/offline-deck.json
            android-app/app/src/main/assets/offline/
          if-no-files-found: error
          retention-days: 7
